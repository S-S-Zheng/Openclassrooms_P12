# ==================================== Assistant Agricole ====================================
#
# Utilisation :
#   1. Copier .env.example vers .env et remplir les clés API.
#   2. docker compose up --build
#   3. Ouvrir http://localhost:8000/docs pour explorer l'API.
#   4. Déclencher la construction de l'index : POST /rebuild avec le header X-Rebuild-Key.
#
# Le répertoire « data » est monté en tant que volume afin que l'index FAISS 
# persiste après les redémarrages du conteneur.
# ========================================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_backend
    # On écrase la commande du Dockerfile pour ne lancer QUE le backend
    command: uvicorn livrable_p12.backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./datas:/app/datas
      - ./configs:/app/configs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_frontend
    # On écrase la commande pour ne lancer QUE le frontend
    command: streamlit run src/livrable_p12/frontend/main.py --server.port 8501
    ports:
      - "8501:8501"
    environment:
      - APP_HOST=backend
      - APP_PORT=8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./datas/results/shap/shap_metadata.json:/app/datas/results/shap/shap_metadata.json